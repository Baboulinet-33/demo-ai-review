# Réglages lus par ai-review. Le fichier est lu depuis la branche par défaut
# (main), donc il s'applique à toutes les pull requests, même anciennes. Même
# mécanique que `.pr_agent.toml` pour pr-agent.
#
# Ce fichier complète les variables d'environnement du workflow, qui portent la
# configuration LLM et VCS mais aucune consigne de revue.
#
# `inline_prompt_files` remplace le fichier `default_inline.md` embarqué dans
# l'outil (la liste par défaut vaut `[default_inline.md]`). Le fichier fourni
# reprend ce défaut mot pour mot, puis ajoute la consigne de performance. Le
# texte de la consigne reprend celui de `pr_reviewer.extra_instructions` de
# pr-agent (`.pr_agent.toml`) : la parité sur la performance est rétablie.
# Le corps de l'action ai-review est figé sur v1.4.0, donc le défaut copié ne
# dérive pas.
prompt:
  inline_prompt_files:
    - ./.ai-review/inline.md
