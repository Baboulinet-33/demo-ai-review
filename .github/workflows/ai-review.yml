# Reviewer: Nikita-Filonov/ai-review
#
# This file is shared by both demo repositories. The guard on `github.repository`
# keeps the job active only in demo-ai-review. In demo-pr-agent the job is skipped.
#
# The review starts when the label `ready-for-llm-review` is added to a pull request.

name: AI Review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Pull request number to review"
        required: true
        type: string

# A benchmark round dispatches nine reviews in parallel. GitHub then throttles
# content creation and answers 403: ai-review drops the comment and the job
# still succeeds. Serialize the runs instead, so only one posts at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  queue: max

jobs:
  ai-review:
    if: >
      github.repository == 'Baboulinet-33/demo-ai-review' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'ready-for-llm-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@v1.4.0
        with:
          review-command: run
        env:
          # LLM: Scaleway Generative APIs (OpenAI-compatible)
          LLM__PROVIDER: "OPENAI"
          LLM__META__MODEL: "qwen3.8-27b"
          LLM__META__MAX_TOKENS: "15000"
          LLM__META__TEMPERATURE: "0.3"
          LLM__HTTP_CLIENT__API_URL: "https://api.scaleway.ai/2b40a887-f3bf-4b0e-ad3e-97fbefe8541c/v1"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.SCW_SECRET_KEY }}

          # GitHub integration
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Review options
          REVIEW__MODE: "FULL_FILE_DIFF"

          # Added and removed lines already carry a "+" or "-" prefix.
          # Disable the default text markers (" # added" / " # removed"):
          # the model read them as real code comments and asked to remove them.
          REVIEW__REVIEW_ADDED_MARKER: ""
          REVIEW__REVIEW_REMOVED_MARKER: ""
